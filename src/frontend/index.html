<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Personal Context Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>Context Agent</h1>
    </div>
    <div class="status" id="status" aria-live="polite">
      <span class="pill" data-key="gemini">gemini</span>
      <span class="pill" data-key="postgres">postgres</span>
      <span class="pill" data-key="redis">redis</span>
    </div>
  </header>

  <main>
    <!-- ---------- Camera ---------- -->
    <section class="card camera-card">
      <div class="card-head">
        <h2>Camera</h2>
        <span class="hint" id="cameraHint">off</span>
      </div>
      <div class="viewport">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="canvas" hidden></canvas>
        <div class="viewport-empty" id="viewportEmpty">
          <p>Camera off</p>
          <small>Turn it on so the agent can see what you're taking with you.</small>
        </div>
        <div class="scan-flash" id="scanFlash" aria-hidden="true"></div>
      </div>
      <div class="row">
        <button id="cameraToggle" class="btn">Start camera</button>
        <button id="flipCamera" class="btn ghost" hidden>Flip</button>
      </div>
    </section>

    <!-- ---------- Talk to it ---------- -->
    <section class="card">
      <div class="card-head">
        <h2>Say something</h2>
        <span class="hint" id="listenHint"></span>
      </div>

      <div class="quick">
        <button class="chip" data-say="I'm going to work">I'm going to work</button>
        <button class="chip" data-say="Where are my AirPods?">Where are my AirPods?</button>
        <button class="chip" data-say="What did I do today?">What did I do today?</button>
      </div>

      <form class="composer" id="composer">
        <button type="button" id="micBtn" class="mic" aria-label="Hold to speak">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z" fill="currentColor"/>
            <path d="M19 12a7 7 0 0 1-14 0M12 19v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="input" type="text" placeholder="Type, or tap the mic…" autocomplete="off" />
        <button type="submit" class="btn primary" id="sendBtn">Send</button>
      </form>
    </section>

    <!-- ---------- Conversation ---------- -->
    <section class="card">
      <div class="card-head">
        <h2>Conversation</h2>
        <label class="toggle">
          <input type="checkbox" id="speakToggle" checked />
          <span>speak replies</span>
        </label>
      </div>
      <div class="transcript" id="transcript" aria-live="polite">
        <p class="placeholder">Nothing yet. Tell it you're heading out.</p>
      </div>
    </section>

    <!-- ---------- What it knows ---------- -->
    <section class="card">
      <div class="card-head">
        <h2>What it knows</h2>
        <button class="btn ghost small" id="refreshState">Refresh</button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="observations" role="tab">Observations</button>
        <button class="tab" data-tab="routines" role="tab">Routines</button>
      </div>
      <div class="tabpanel" id="panel-observations"><p class="placeholder">No observations yet.</p></div>
      <div class="tabpanel" id="panel-routines" hidden><p class="placeholder">No routines learned yet.</p></div>
    </section>
  </main>

  <script src="/static/camera.js"></script>
  <script src="/static/speech.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
