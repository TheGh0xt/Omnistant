[project]
name = "omnistant"
version = "0.1.0"
description = "A personal-context agent that remembers where your things are."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.7.1",
    "greenlet>=3.5.5",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# "." so `tests.conftest` resolves under a bare `pytest` too: `python -m pytest`
# silently inserts the cwd and a plain `pytest` does not, so without this the
# suite passes one way and fails collection the other.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::UserWarning:google.adk.*"]
