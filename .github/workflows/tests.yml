# The suite is hermetic: no database, no Redis, no API key, no network. Verified
# by running it in a clean clone with no .env present. So CI needs no secrets,
# and a failure here is a real failure rather than a missing credential.
#
# This exists because the suite was silently uncollectable under a bare `pytest`
# for several commits while passing under `python -m pytest`. Both entry points
# run below, so that specific failure cannot come back unnoticed.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: pytest
        run: uv run pytest -q

      - name: python -m pytest
        run: uv run python -m pytest -q

      # The frontend has no build step and no package.json; node --test ships
      # with Node, so the wake-word regressions cost one step and no dependency.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --test
        run: node --test tests/js/*.test.js
